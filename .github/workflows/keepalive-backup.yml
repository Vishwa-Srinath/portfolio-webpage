name: Keep-Alive & DB Backup

# Runs every 3 days (midnight UTC on days 1, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31)
# Purposes:
#   1. Keep Supabase from pausing (pauses after 7 days of zero API activity)
#   2. Take a pg_dump backup of the Supabase database and store it as a
#      GitHub Actions artifact (retained for 30 days, then auto-deleted)
#
# NOTE (v2.0): Render has been replaced by AWS Lambda. Lambda has no sleep
# state to fight — we no longer need to ping it to keep it "warm." This workflow
# now only pings the health endpoint to confirm Supabase is up and reset its
# 7-day pause timer. The Lambda ping is a bonus health check, not a keep-alive.
#
# Required GitHub Secrets (set at: repo > Settings > Secrets and variables > Actions):
#
#   SUPABASE_DB_HOST     → db.<project-ref>.supabase.co
#   SUPABASE_DB_NAME     → postgres
#   SUPABASE_DB_USER     → postgres
#   SUPABASE_DB_PASSWORD → (from Supabase dashboard > Settings > Database > Connection info)
#
# The health URL below is NOT a secret — it is a public endpoint.
# Replace "yourdomain.com" with your actual custom domain once DNS is wired.

on:
  schedule:
    # Every 3 days at midnight UTC
    - cron: "0 0 */3 * *"

  # Allow running manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  keepalive-and-backup:
    name: Ping API health + backup database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────
      # Step 1: Ping Lambda/API health endpoint
      # This resets Supabase's 7-day inactivity timer by triggering
      # a real DB query inside the health check handler.
      # Lambda itself has no sleep state — this is purely for Supabase.
      # ─────────────────────────────────────────────────────────
      - name: Ping API health endpoint (resets Supabase 7-day timer)
        run: |
          echo "Pinging API health endpoint..."
          response=$(curl \
            --silent \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            "https://api.yourdomain.com/api/v1/health")

          http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | grep -v "HTTP_STATUS:")

          echo "Response: $body"
          echo "HTTP Status: $http_status"

          if [ "$http_status" = "200" ]; then
            echo "✅ API is healthy — Supabase pause timer reset"
          else
            echo "⚠️  API returned HTTP $http_status — check CloudWatch Logs"
            # Don't fail the workflow; backup is more important than a health blip
          fi

      # ─────────────────────────────────────────────────────────
      # Step 2: Install pg_dump (PostgreSQL client tools)
      # ─────────────────────────────────────────────────────────
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      # ─────────────────────────────────────────────────────────
      # Step 3: Run pg_dump against Supabase
      # The direct DB connection also counts as activity and resets
      # the 7-day pause timer independently of the HTTP ping above.
      # ─────────────────────────────────────────────────────────
      - name: Backup Supabase database (pg_dump)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          BACKUP_FILE="backups/supabase_backup_${TIMESTAMP}.sql"

          echo "Starting pg_dump to $BACKUP_FILE ..."

          pg_dump \
            --host="${{ secrets.SUPABASE_DB_HOST }}" \
            --port=5432 \
            --username="${{ secrets.SUPABASE_DB_USER }}" \
            --dbname="${{ secrets.SUPABASE_DB_NAME }}" \
            --no-password \
            --format=plain \
            --clean \
            --if-exists \
            --no-owner \
            --no-acl \
            --exclude-schema=extensions \
            --exclude-schema=graphql \
            --exclude-schema=graphql_public \
            --exclude-schema=net \
            --exclude-schema=realtime \
            --exclude-schema=storage \
            --exclude-schema=supabase_functions \
            --exclude-schema=vault \
            --schema=public \
            > "$BACKUP_FILE"

          BACKUP_SIZE=$(du -sh "$BACKUP_FILE" | cut -f1)
          echo "✅ Backup complete: $BACKUP_FILE ($BACKUP_SIZE)"
          echo "backup_file=$BACKUP_FILE" >> $GITHUB_OUTPUT
        id: backup

      # ─────────────────────────────────────────────────────────
      # Step 4: Upload the backup as a GitHub Actions artifact
      # Retained for 30 days, then auto-deleted.
      # ─────────────────────────────────────────────────────────
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error

      # ─────────────────────────────────────────────────────────
      # Step 5: Summary
      # ─────────────────────────────────────────────────────────
      - name: Job summary
        run: |
          echo "## Keep-Alive & Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Lambda health ping | ✅ Sent |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase backup | ✅ Created (30-day retention) |" >> $GITHUB_STEP_SUMMARY
          echo "| Supabase pause timer | ✅ Reset |" >> $GITHUB_STEP_SUMMARY
